services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: study
      MARIADB_USER: study
      MARIADB_PASSWORD: study
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
      # Dev-only grants (shadow database for prisma migrate dev). Runs on first volume creation.
      - ./docker/mariadb-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  dbdata:
